services:
  - type: web
    name: mandateguard-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHAIN_ID
        value: 84532
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: SIGNER_TYPE
        value: local
      - key: AUTHORIZER_PRIVATE_KEY
        generateValue: true
      - key: SMART_ACCOUNT_ADDRESS
        value: "0xB07e049cc3245e8a765bA9bfb537CF5D5fFd4D68"
      - key: FACTORY_ADDRESS
        value: "0xc1715490738Ec42fc975B704Cb1542edf46368C9"
      - key: MOCK_USDC_ADDRESS
        value: "0x9CA71737B76EE51d2366C53CC8CdF21DC5246097"
