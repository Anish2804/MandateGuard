services:
  - type: web
    name: mandateguard-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHAIN_ID
        value: 84532
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: SIGNER_TYPE
        value: local
      - key: AUTHORIZER_PRIVATE_KEY
        generateValue: true
      - key: SMART_ACCOUNT_ADDRESS
        value: "0x99F586Cc654DBcf073cf9593e8ec4C4037d85936"
      - key: FACTORY_ADDRESS
        value: "0x3F577D49773Fc45526181534f8E67B8CD806b176"
      - key: MOCK_USDC_ADDRESS
        value: "0xa25C3a6A13F32Ac8142CDc232164f16311640dF7"
