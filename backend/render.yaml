services:
  - type: web
    name: mandateguard-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHAIN_ID
        value: 84532
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: SIGNER_TYPE
        value: local
      - key: AUTHORIZER_PRIVATE_KEY
        generateValue: true
      - key: SMART_ACCOUNT_ADDRESS
        value: "0x0000000000000000000000000000000000000000"
      - key: FACTORY_ADDRESS
        value: "0x70e0bA845a1A0F2DA3359C97E0285013525FFC49"
