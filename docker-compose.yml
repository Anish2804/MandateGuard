version: "3.8"

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: mandateguard-anvil
    command: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--port", "8545"]
    ports:
      - "8545:8545"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandateguard-backend
    ports:
      - "8000:8000"
    environment:
      - CHAIN_ID=31337
      - RPC_URL=http://anvil:8545
      - SMART_ACCOUNT_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - MOCK_USDC_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - DATABASE_URL=sqlite+aiosqlite:///./mandateguard.db
      - AUTHORIZER_PRIVATE_KEY=0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
    depends_on:
      - anvil
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandateguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_RPC_URL=http://localhost:8545
      - NEXT_PUBLIC_CHAIN_ID=31337
      - NEXT_PUBLIC_SMART_ACCOUNT_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - NEXT_PUBLIC_MOCK_USDC_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
    depends_on:
      - backend
    restart: unless-stopped
